version: '3.8'

services:
  web:
    image: ${CI_REGISTRY_IMAGE}:latest 
    container_name: techremont-web
    ports:
      - "8000:80"  
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

