stages:
  - build
  - deploy

variables:
  SERVER_USER: "topowiy_fermer"
  SERVER_IP: "158.160.91.4"
  PROJECT_PATH: "/home/$SERVER_USER/ristos"

build:
  stage: build
  image: docker:24
  services:
    - name: docker:24-dind
      alias: docker
  tags:
    - common
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: tcp://docker:2375
    GIT_SSL_NO_VERIFY: "true" 
  before_script:
    - docker info
  script:
    # 1. Логин в registry (GitLab подставит $CI_REGISTRY автоматически)
    - echo "$CI_JOB_TOKEN" | docker login -u gitlab-ci-token --password-stdin $CI_REGISTRY

    # 2. Сборка образа с тегом = короткий хеш коммита
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA .

    # 3. Пуш в registry
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA

    # 4. latest (удобно для локального теста)
    - docker tag $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA $CI_REGISTRY_IMAGE:latest
    - docker push $CI_REGISTRY_IMAGE:latest

  rules:
    - if: $CI_COMMIT_BRANCH == "main"

deploy:
  stage: deploy
  image: alpine:latest
  tags:
    - common
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H "$SERVER_IP" >> ~/.ssh/known_hosts
  script:
    - |
      ssh "$SERVER_USER@$SERVER_IP" "
        cd $PROJECT_PATH &&

        # Подменяем image в docker-compose.yml
        sed -i \"s|image:.*|image: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA|\" docker-compose.yml || true

        # Перезапускаем
        docker compose down 2>/dev/null || true
        docker compose up -d
      "
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
  environment:
    name: production
    url: http://ristos.dev-ops8.ru