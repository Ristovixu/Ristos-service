stages:
  - build
  - deploy

variables:
  DEPLOY_SERVER_IP: "158.160.91.4"

  DEPLOY_USER: "topowiy_fermer"

  SSH_PORT: "22"

build-job:
  stage: build
  image: docker:24.0
  services:
    - name: docker:24.0-dind
      alias: docker
  tags:
    - common
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: tcp://docker:2375
    GIT_SSL_NO_VERIFY: "true"
  script:
    - echo "✅ Логинимся в GitLab Container Registry..."
    - echo "$CI_JOB_TOKEN" | docker login -u gitlab-ci-token --password-stdin "$CI_REGISTRY"
    - echo "🏗️ Собираем образ $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA..."
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" .
    - echo "📤 Пушим образ..."
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - echo "✅ Образ загружен."
  only:
    - main

deploy-job:
  stage: deploy
  image: alpine:latest
  tags:
    - common
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - ssh-keyscan -p "$SSH_PORT" "$DEPLOY_SERVER_IP" >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - |
      cat > docker-compose.yml <<EOF
      version: '3.8'
      services:
        website:
          image: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
          container_name: website
          ports:
            - "80:80"
          restart: unless-stopped
      EOF
    - scp -P "$SSH_PORT" docker-compose.yml "$DEPLOY_USER@$DEPLOY_SERVER_IP:/home/$DEPLOY_USER/"
    - |
      ssh -p "$SSH_PORT" "$DEPLOY_USER@$DEPLOY_SERVER_IP" "
        cd /home/$DEPLOY_USER &&
        echo '📥 Логинимся в registry...' &&
        docker login -u gitlab-ci-token -p '$CI_JOB_TOKEN' $CI_REGISTRY &&
        echo '⬇️ Останавливаем старый контейнер...' &&
        docker compose down --remove-orphans 2>/dev/null || true &&
        echo '🔃 Пуллим новый образ...' &&
        docker compose pull &&
        echo '🚀 Запускаем...' &&
        docker compose up -d &&
        echo '✅ Готово!'
      "
    - echo "🌐 Сайт доступен по http://$DEPLOY_SERVER_IP"
  when: manual
  only:
    - main